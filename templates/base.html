<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tracker{% endblock %}</title>
  <style>
    :root {
      --bg: #070b16; --surface: #121a2b; --surface-2: #182236;
      --line: rgba(148,163,184,.16); --text: #e8eefc; --muted: #8b9bb8;
      --accent: #34d399; --accent-ink: #052e22; --danger: #fb7185;
      --warn: #fbbf24; --info: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(900px 600px at 8% -12%, rgba(52,211,153,.10), transparent 62%),
                  radial-gradient(900px 700px at 105% 0%, rgba(99,102,241,.14), transparent 58%),
                  linear-gradient(165deg, #070b16, #0a1020);
      background-attachment: fixed;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar {
      display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
      padding: 14px 26px; border-bottom: 1px solid var(--line);
      background: rgba(7,11,22,.72); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-weight: 700; letter-spacing: -.01em; font-size: 1.05rem; color: var(--text); }
    .brand span { color: var(--accent); }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a {
      padding: 7px 12px; border-radius: 9px; color: var(--muted);
      font-size: .88rem; font-weight: 500;
    }
    .nav a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
    .nav a.active { background: rgba(52,211,153,.12); color: var(--accent); }
    .spacer { flex: 1; }
    .user { color: var(--muted); font-size: .84rem; display: flex; align-items: center; gap: 12px; }
    .user form { margin: 0; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 30px 26px 60px; }
    h1 { font-size: 1.65rem; margin: 0 0 4px; letter-spacing: -.02em; }
    .lede { color: var(--muted); margin: 0 0 26px; font-size: .93rem; }
    .grid { display: grid; gap: 16px; }
    .cards { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 26px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px;
    }
    .card .label { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .09em; }
    .card .value { font-size: 1.9rem; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: .95rem; letter-spacing: .02em; }
    .panel-body { padding: 18px 20px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid rgba(148,163,184,.09); }
    th { color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
    tbody tr:hover { background: rgba(148,163,184,.05); }
    tbody tr:last-child td { border-bottom: 0; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; color: var(--muted); }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .74rem;
      font-weight: 600; letter-spacing: .03em; white-space: nowrap;
      background: rgba(148,163,184,.14); color: #cbd5e1;
    }
    .badge.in-use { background: rgba(52,211,153,.14); color: #34d399; }
    .badge.in-storage { background: rgba(96,165,250,.14); color: #93c5fd; }
    .badge.maintenance { background: rgba(251,191,36,.14); color: #fbbf24; }
    .badge.retired { background: rgba(148,163,184,.14); color: #cbd5e1; }
    .badge.lost { background: rgba(251,113,133,.16); color: #fb7185; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
      font: inherit; font-size: .86rem; font-weight: 550; cursor: pointer; text-decoration: none;
    }
    .btn:hover { border-color: rgba(148,163,184,.4); text-decoration: none; }
    .btn-primary { background: linear-gradient(180deg, #34d399, #10b981); color: var(--accent-ink); border-color: transparent; font-weight: 650; }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-danger { background: rgba(251,113,133,.12); color: #fb7185; border-color: rgba(251,113,133,.35); }
    .btn-small { padding: 5px 10px; font-size: .78rem; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    input, select, textarea {
      font: inherit; font-size: .88rem; color: var(--text);
      background: #0d1524; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgba(52,211,153,.5); outline-offset: 1px; border-color: transparent; }
    .filters input[type=search] { flex: 1; min-width: 220px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
    .field input, .field select, .field textarea { width: 100%; }
    .helptext { color: var(--muted); font-size: .76rem; }
    .errorlist { color: var(--danger); font-size: .8rem; margin: 2px 0 0; padding-left: 18px; }
    .messages { list-style: none; margin: 0 0 22px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .messages li {
      padding: 11px 15px; border-radius: 10px; font-size: .88rem;
      background: rgba(52,211,153,.10); color: #86efac; border: 1px solid rgba(52,211,153,.25);
    }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
    .empty p { margin: 0 0 14px; }
    .meta { display: grid; grid-template-columns: 150px 1fr; gap: 12px 18px; font-size: .92rem; margin: 0; }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
    .bar { height: 6px; border-radius: 999px; background: rgba(148,163,184,.14); overflow: hidden; margin-top: 8px; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, #34d399, #10b981); }
    @media (max-width: 860px) {
      .two-col { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .wrap { padding: 22px 16px 50px; }
      .topbar { padding: 12px 16px; gap: 12px; }
      td, th { padding: 9px 10px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="brand">Asset<span>Tracker</span></div>
    <nav class="nav">
      <a href="{% url 'inventory:dashboard' %}" class="{% if active_nav == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{% url 'inventory:asset_list' %}" class="{% if active_nav == 'assets' %}active{% endif %}">Assets</a>
      {% if user.is_superuser %}
        <a href="{% url 'admin:index' %}">Administer</a>
      {% endif %}
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span>{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-small" type="submit">Sign out</button>
      </form>
    </div>
  </header>

  <main class="wrap">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
